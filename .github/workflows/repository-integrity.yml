name: Repository Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify baseline
        shell: bash
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f .tlb/repository.yaml
