name: Repository Integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify baseline
        shell: bash
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f .tlb/repository.yaml